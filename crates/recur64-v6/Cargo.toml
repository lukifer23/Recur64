[package]
name = "recur64-v6"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = ["recur64-v5/cpu", "burn/flex"]
cuda = ["recur64-v5/cuda", "burn/cuda"]

[dependencies]
recur64-core = { path = "../recur64-core" }
recur64-statequery = { path = "../recur64-statequery" }
recur64-v5 = { path = "../recur64-v5", default-features = false }
recur64-model = { path = "../recur64-model", default-features = false }
recur64-runtime = { path = "../recur64-runtime", default-features = false }
burn = { workspace = true, features = ["std", "autodiff"] }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
clap = { workspace = true }
sha2 = "0.10"
