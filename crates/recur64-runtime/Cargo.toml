[package]
name = "recur64-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["cpu"]
cpu = ["recur64-model/cpu"]
cuda = ["recur64-model/cuda"]

[dependencies]
recur64-core = { path = "../recur64-core" }
recur64-search = { path = "../recur64-search" }
recur64-model = { path = "../recur64-model", default-features = false }
burn = { workspace = true, features = ["std", "autodiff"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
recur64-eval = { path = "../recur64-eval", default-features = false }
bincode = { version = "2", features = ["serde"] }
crc32fast = "1"
sha2 = "0.10"
ctrlc = "3"
