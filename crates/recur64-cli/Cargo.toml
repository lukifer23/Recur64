[package]
name = "recur64-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "recur64"
path = "src/main.rs"

[features]
default = ["cpu"]
cpu = ["recur64-model/cpu", "recur64-runtime/cpu", "burn/flex"]
cuda = ["recur64-model/cuda", "recur64-runtime/cuda", "burn/cuda"]
store = ["recur64-model/store"]
# Throughput experiments (docs/PERF_LEDGER.md). Off by default: the validated
# default build is plain CubeCL CUDA without fusion or autotune.
fusion = ["burn/fusion"]
autotune = ["burn/autotune"]

[dependencies]
recur64-core = { path = "../recur64-core" }
recur64-model = { path = "../recur64-model", default-features = false }
recur64-runtime = { path = "../recur64-runtime", default-features = false }
recur64-eval = { path = "../recur64-eval", default-features = false }
recur64-compute = { path = "../recur64-compute" }
recur64-coproc = { path = "../recur64-coproc" }
recur64-search = { path = "../recur64-search" }
burn = { workspace = true, features = ["std", "autodiff"] }
clap = { workspace = true }
anyhow = { workspace = true }
cozy-chess = { workspace = true }
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
