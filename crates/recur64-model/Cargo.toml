[package]
name = "recur64-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["cpu"]
# CPU FP32 correctness baseline (Burn Flex backend) with autodiff.
cpu = ["burn/flex"]
# NVIDIA CUDA backend (requires a CUDA 12.x runtime on PATH; see docs/DECISIONS.md).
cuda = ["burn/cuda"]
# TF32 tensor-core matmuls (T5): autotune with accelerated kernels. A tf32
# binary serves only precision = "tf32" (see precision::ensure_supported).
tf32 = ["cuda", "burn/autotune"]
# Safetensors / model-store checkpoint formats.
store = ["burn/store"]

[dependencies]
recur64-core = { path = "../recur64-core" }
recur64-statequery = { path = "../recur64-statequery" }
burn = { workspace = true, features = ["std", "autodiff"] }
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
