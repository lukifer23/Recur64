[package]
name = "recur64-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["cpu"]
# CPU FP32 correctness baseline (Burn Flex backend) with autodiff.
cpu = ["burn/flex"]
# NVIDIA CUDA backend (requires a CUDA 12.x runtime on PATH; see docs/DECISIONS.md).
cuda = ["burn/cuda"]
# Safetensors / model-store checkpoint formats.
store = ["burn/store"]

[dependencies]
burn = { workspace = true, features = ["std", "autodiff"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
