# Recur64 HP H3 — F15 smoke v2 (3 cycles), head v2.
#
# The corrected bounded F15 smoke after the mainline transfer. Every value below
# is derived from HP H3 measurements (docs/HP_H3_RESULTS.md), not historical
# inertia or mainline F10 numbers. Frozen before the run. New identity; the
# historical configs/hp/f15-smoke.toml is untouched.
#
# Measured basis:
#   - K = 2 leaves (H3.3A: +13.2% trainable pos/s, identical data health).
#   - concurrency 8, batch cap 16 (H3.3B: c8/c12/c16 within 4.4%, prefer lower).
#   - training 32x4, effective 128 (H3.3C: 64x2 only +5.2% for +672 MB).
#   - search budget 32 (H3.4: identical health to 64, +86% trainable pos/s).
#   - arena = D45 V2 (H3.5: sample 30 plies + root noise; see H3.5 decision).
run_id = "hp-h3-f15-smoke-v2"
device = "cuda"
precision = "fp32"
recurrence = 1
model_profile = "f15"
hardware_profile = "hp-home"
seed = 1

reference_checkpoint = "runs/hp-h3-ref-f15-v2"
reference_model_id = "d89b408fcc7a3cd9874a0ffbbcafd121c6c78cbb9818d4adaac0fe8d51ea234b"

# --- Search / self-play contract (H3.4 budget; D41 exploration) ---
simulations_per_move = 32
c_puct = 1.0
temperature = 1.0
argmax_after_ply = 30
root_dirichlet_alpha = 0.3
root_dirichlet_epsilon = 0.25
ply_cap = 400
# H3.3A (adopted): 2 leaves per search round with virtual loss.
search_leaves_in_flight = 2

# --- Collection (scientific: total games; the rest is scheduling) ---
# 32 games = four waves at concurrency 8.
games_per_cycle = 32

# --- Hardware schedule (H3.3B, MEASURED on the RTX 2050) ---
concurrent_games = 8
cpu_workers = 8
# K = 2 leaves x 8 games -> batch cap 16.
max_inference_batch = 16
batch_timeout_us = 1000
# H3.3C (retained prior): effective batch 32 x 4 = 128.
train_batch = 32
accumulation_steps = 4

# --- Replay / learner ---
shard_max_games = 256
replay_max_positions = 100000
replay_reuse_target = 2.0
lr = 3.0e-4
# Expected ~5,247 new trainable positions/cycle at 32 sims/K=2.
# -> ceil(5247 * 2.0 / 128) = 82 requested updates/cycle; 3 cycles = 246.
planned_updates = 246
warmup_updates = 25
# Safety cap ~3.1x the expected total; a binding cap is a health warning, not a
# schedule. It must never control the intended reuse.
max_updates = 768

# --- Evaluation / promotion ---
arena_games = 32
# H3.5 (adopted): sample 30 plies, root Dirichlet noise on every move.
arena_sample_plies = 30
arena_root_dirichlet_epsilon = 0.25
opening_suite = "configs/openings-v1.toml"
snapshot_policy = "conservative"
# D48 (adopted): the learner keeps weights + Adam + LR step across a held cycle;
# the actor only advances on promotion.
trainer_policy = "continuous"
promotion_score_floor = 0.5
promotion_min_decisive_games = 4

# --- Execution bounds (excluded from scientific identity) ---
cycles = 3
# 180 min, not the historical 90: the historical head-v1 cap was for a run whose
# arenas were cheap threefold draws. H3's D45 V2 arenas are ~10 min each (585 s
# measured for 32 games at concurrency 8), so 3 cycles need more wall headroom.
# This is an execution bound only; it does not enter the scientific identity.
run_budget_minutes = 180
# ~2.5x the expected 3 x 6,047 positions.
position_budget = 45000

[model]
width = 512
heads = 8
ffn = 768
input_blocks = 0
core_blocks = 8
output_blocks = 0
squares = 64
in_features = 119
policy_dim = 128
wdl_classes = 3
promo_codes = 5
rms_eps = 1e-5
