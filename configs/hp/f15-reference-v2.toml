# Recur64 HP H3 — frozen F15 **head-v2** reference (seeded untrained weights).
#
# `recur64 freeze-reference --config configs/hp/f15-reference-v2.toml \
#    --output runs/hp-h3-ref-f15-v2` writes the ONE checkpoint every H3
#    requalification cell (lifecycle, K sweep, search curve, smoke) starts from.
#    Runs pin it by content hash (`reference_model_id`), and the hashes in the
#    reference's own reference.json describe this freezing config only.
#
# Head v2 (D40): a final RMSNorm precedes the policy/WDL heads, policy logits are
# scaled by 1/sqrt(policy_dim), and WDL is zero-initialized. The final norm adds
# 512 parameters, so the F15/R15 unique count is 15,154,632 (was 15,154,120
# under head v1).
#
# This is a NEW identity. The head-v1 reference and its evidence are preserved
# unchanged in configs/hp/f15-reference.toml and docs/HP_H1_RESULTS.md.
run_id = "hp-h3-ref-f15-v2"
device = "cuda"
precision = "fp32"
recurrence = 1
model_profile = "f15"
hardware_profile = "hp-home"
seed = 1

# Search contract (recorded for continuity; the reference itself is not searched).
simulations_per_move = 64
c_puct = 1.0
temperature = 1.0
ply_cap = 400
# Self-play exploration contract (D41): sample the first 30 plies, then argmax.
argmax_after_ply = 30
root_dirichlet_alpha = 0.3
root_dirichlet_epsilon = 0.25

# Collection contract. This is the historical HP scheduling prior; H3.3
# re-measures K, concurrency and batch layout rather than assuming it.
games_per_cycle = 32
concurrent_games = 16
cpu_workers = 12
max_inference_batch = 32
batch_timeout_us = 1000

# Replay / learner contract.
lr = 3.0e-4
train_batch = 32
accumulation_steps = 4
replay_reuse_target = 2.0
opening_suite = "configs/openings-v1.toml"

[model]
width = 512
heads = 8
ffn = 768
input_blocks = 0
core_blocks = 8
output_blocks = 0
squares = 64
in_features = 119
policy_dim = 128
wdl_classes = 3
promo_codes = 5
rms_eps = 1e-5
