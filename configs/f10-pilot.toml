# Recur64 Phase 3 — ~2 hour F10 pilot (Stage C).
#
# Same frozen contract as f10-baseline.toml, but multiple bounded cycles inside a
# wall-clock/position budget. Standard start. No architecture changes mid-pilot.
run_id = "f10-pilot"
device = "cuda"
precision = "fp32"
recurrence = 1

simulations_per_move = 64
c_puct = 1.0
temperature = 1.0
active_games = 64
cpu_workers = 8
ply_cap = 512
seed = 1

max_inference_batch = 64
batch_timeout_us = 500

shard_max_games = 256
replay_max_positions = 100000
replay_reuse_target = 2.0

train_batch = 64
accumulation_steps = 4
max_updates = 500
lr = 3.0e-4

arena_games = 100
opening_suite = "configs/openings-v1.toml"

# Bounded multi-cycle pilot.
cycles = 6
position_budget = 60000
snapshot_policy = "conservative"
promotion_score_floor = 0.35
run_budget_minutes = 120

[model]
width = 384
heads = 12
ffn = 768
input_blocks = 0
core_blocks = 8
output_blocks = 0
squares = 64
in_features = 119
policy_dim = 128
wdl_classes = 3
promo_codes = 5
rms_eps = 1e-5
