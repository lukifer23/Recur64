# Recur64 Phase 3 Stage B — short F10 learning smoke (multi-cycle, CUDA).
run_id = "f10-pilot-smoke"
device = "cuda"
precision = "fp32"
recurrence = 1

simulations_per_move = 16
c_puct = 1.0
temperature = 1.0
active_games = 32
cpu_workers = 8
ply_cap = 200
seed = 1

max_inference_batch = 64
batch_timeout_us = 500

shard_max_games = 64
replay_max_positions = 100000
replay_reuse_target = 2.0

train_batch = 32
accumulation_steps = 2
max_updates = 4
lr = 3.0e-4

arena_games = 8
opening_suite = "configs/openings-v1.toml"

cycles = 2
snapshot_policy = "conservative"
promotion_score_floor = 0.35
run_budget_minutes = 20

[model]
width = 384
heads = 12
ffn = 768
input_blocks = 0
core_blocks = 8
output_blocks = 0
squares = 64
in_features = 119
policy_dim = 128
wdl_classes = 3
promo_codes = 5
rms_eps = 1e-5
