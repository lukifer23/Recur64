[workspace]
resolver = "2"
members = [
    "crates/recur64-core",
    "crates/recur64-search",
    "crates/recur64-model",
    "crates/recur64-runtime",
    "crates/recur64-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukifer23/Recur64"
description = "Recur64 - a Rust-first chess-learning research laboratory (Phase 0 probe)"

[workspace.dependencies]
# Pinned per docs/DECISIONS.md. Burn stable line with a stable burn-cuda.
burn = { version = "=0.21.0", default-features = false }
# Chess rules/movegen. MIT. See docs/DECISIONS.md D9.
cozy-chess = { version = "=0.3.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
